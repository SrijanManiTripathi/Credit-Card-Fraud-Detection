<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#FF9933" />
  <rect y="200" width="900" height="200" fill="#FFFFFF" />
  <rect y="400" width="900" height="200" fill="#138808" />
  <circle cx="450" cy="300" r="60" fill="none" stroke="#000080" stroke-width="8" />
  <!-- simplified chakra spokes -->
  <g stroke="#000080" stroke-width="4" transform="translate(450,300)">
    <line x1="0" y1="0" x2="0" y2="-60" />
    <line x1="0" y1="0" x2="52" y2="-38" transform="rotate(30)" />
    <line x1="0" y1="0" x2="52" y2="38" transform="rotate(60)" />
    <line x1="0" y1="0" x2="0" y2="60" transform="rotate(90)" />
    <line x1="0" y1="0" x2="-52" y2="38" transform="rotate(120)" />
    <line x1="0" y1="0" x2="-52" y2="-38" transform="rotate(150)" />
  </g>
</svg>
